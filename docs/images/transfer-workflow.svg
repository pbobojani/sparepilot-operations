<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">SPARE: stock transfer hand-offs</title><desc id="desc">Requests can queue offline. Warehouse dispatch and destination receipt require live permission and version checks. Stale writes return 409 for operator review.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#3d5a80"/></marker></defs>
<rect width="720" height="350" rx="14" fill="#f6f8fb"/>
<g font-family="Arial,sans-serif" fill="#1a1a1e">
<text x="28" y="33" font-size="12" letter-spacing="2" fill="#3d5a80">SPARE / TRANSFER WORKFLOW</text>
<g fill="white" stroke="#bbc7d5"><rect x="28" y="68" width="196" height="98" rx="8"/><rect x="262" y="68" width="196" height="98" rx="8"/><rect x="496" y="68" width="196" height="98" rx="8"/></g>
<g font-size="18" font-weight="600"><text x="44" y="98">01 / Request</text><text x="278" y="98">02 / Fulfil</text><text x="512" y="98">03 / Receive</text></g>
<g font-size="13" fill="#596170"><text x="44" y="126">Shop asks for stock</text><text x="44" y="148">State: requested</text><text x="278" y="126">Warehouse dispatches</text><text x="278" y="148">State: in_transit</text><text x="512" y="126">Destination confirms</text><text x="512" y="148">State: received</text></g>
<text x="28" y="200" font-size="14" fill="#3d5a80">Request may queue offline</text><text x="262" y="200" font-size="14" fill="#3d5a80">Live API + role + expected version</text>
<rect x="28" y="231" width="664" height="88" rx="8" fill="#e9edf3"/>
<text x="44" y="259" font-size="15" font-weight="600">Reject stale writes. Do not silently merge stock.</text>
<text x="44" y="282" font-size="13" fill="#596170">A version mismatch returns HTTP 409 for operator review.</text>
<text x="44" y="303" font-size="13" fill="#596170">Accepted movements update the stock ledger at the appropriate hand-off.</text>
</g><g fill="none" stroke="#3d5a80" stroke-width="2" marker-end="url(#a)"><path d="M224 116H253"/><path d="M458 116H487"/></g></svg>
